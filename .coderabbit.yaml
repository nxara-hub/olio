# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
# CLAUDE.md is read as the review guidelines by default.
language: en-US
tone_instructions: "Be brief and plain. Name the file and line, say what breaks and how. Skip praise and style nits the linters already catch."
reviews:
  profile: chill
  poem: false
  # The website preview deploys once CodeRabbit approves (.github/workflows/website.yml).
  auto_approvals:
    enabled: true
  auto_review:
    enabled: true
    drafts: false
    # Release PRs (bun run release) only bump versions, and need just check
    # and zizmor to merge, so they'd only use up the hourly review limit.
    ignore_title_keywords:
      - "release: v"
  pre_merge_checks:
    # The repo keeps doc comments to what a signature can't say (CLAUDE.md),
    # so a coverage threshold would ask for the comments it rules out, and its
    # failure withholds the automatic approval.
    docstrings:
      mode: "off"
  path_filters:
    - "!**/generated.ts"
    - "!apps/example-server/src/schema.gql"
    - "!**/dist/**"
    - "!bun.lock"
    - "!mise.lock"
  path_instructions:
    - path: "apps/website/src/content/docs/**"
      instructions: "Docs prose uses separate sentences, not semicolons joining clauses. Code samples must compile against the current packages and show real output."
  tools:
    # The repo lints with oxlint and formats with oxfmt (Ultracite), so Biome's
    # opinions would only disagree with them.
    biome:
      enabled: false
chat:
  auto_reply: true
