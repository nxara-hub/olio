name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the GitHub release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: bun run check-types
      - run: bun run test
      # --recursive skips versions already on npm, so a failed run can be rerun.
      - name: Publish to npm
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          for dir in packages/*/; do
            if [ "$(jq -r .version "$dir/package.json")" != "$version" ]; then
              echo "$dir is not at $version: tag a commit made by bun run release"
              exit 1
            fi
            cp LICENSE "$dir"
          done
          dist_tag=latest
          [[ "$version" == *-* ]] && dist_tag=next
          bun publish --recursive --tag "$dist_tag"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=--prerelease
          gh release create "$GITHUB_REF_NAME" --generate-notes $prerelease
