name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the GitHub release
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: bun run check-types
      - run: bun run test
      # bun packs (it rewrites workspace:* to the version), npm publishes (it
      # signs provenance). Already published versions are skipped, so a failed
      # run can be rerun.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          dist_tag=latest
          [[ "$version" == *-* ]] && dist_tag=next
          out=$(mktemp -d)
          for dir in packages/*/; do
            name=$(jq -r .name "$dir/package.json")
            if [ "$(jq -r .version "$dir/package.json")" != "$version" ]; then
              echo "$name is not at $version: tag a commit made by bun run release"
              exit 1
            fi
            cp LICENSE "$dir"
            tarball="$out/$(basename "$dir").tgz"
            (cd "$dir" && bun pm pack --quiet --filename "$tarball")
            # npm runs outside the repo, whose devEngines asks for bun.
            (
              cd "$out"
              if npm view "$name@$version" version >/dev/null 2>&1; then
                echo "$name@$version is already published"
              else
                npm publish "$tarball" --provenance --access public --tag "$dist_tag"
              fi
            )
          done
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=--prerelease
          gh release create "$GITHUB_REF_NAME" --generate-notes $prerelease
