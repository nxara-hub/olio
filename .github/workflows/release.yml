name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No tool cache: a restored cache is trusted as is, and this job publishes.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.18
          cache: false
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: bun run check-types
      - run: bun run test
      # bun packs (it rewrites workspace:*); npm publishes, since only npm signs
      # in with trusted publishing. npm runs outside the repo, whose devEngines
      # asks for bun. Versions already on npm are skipped, so a failed run can be
      # rerun.
      - name: Publish to npm
        run: |
          version="${GITHUB_REF_NAME#v}"
          dist_tag=latest
          [[ "$version" == *-* ]] && dist_tag=next
          out=$(mktemp -d)
          for dir in packages/*/; do
            name=$(jq -r .name "$dir/package.json")
            if [ "$(jq -r .version "$dir/package.json")" != "$version" ]; then
              echo "$name is not at $version: tag a commit made by bun run release"
              exit 1
            fi
            cp LICENSE "$dir"
            tarball="$out/$(basename "$dir").tgz"
            (cd "$dir" && bun pm pack --quiet --filename "$tarball")
            (
              cd "$out"
              if npm view "$name@$version" version >/dev/null 2>&1; then
                echo "$name@$version is already published"
              else
                npm publish "$tarball" --access public --tag "$dist_tag"
              fi
            )
          done
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=--prerelease
          gh release create "$GITHUB_REF_NAME" --generate-notes $prerelease
