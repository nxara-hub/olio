name: Website

on:
  push:
    branches: [main]
    paths:
      - apps/website/**
      - bun.lock
      - bunfig.toml
      - mise.toml
      - mise.lock
      - .github/workflows/website.yml
  # A preview deploys once CodeRabbit approves the PR, not on every push to it.
  pull_request_review:
    types: [submitted]

permissions: {}

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # main deploys to production, a PR to its own preview URL. Pull requests
    # from forks get no secrets, so they're skipped.
    if: >-
      github.event_name == 'push' ||
      (github.event.review.state == 'approved' &&
      github.event.review.user.login == 'coderabbitai[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No tool cache: a restored cache is trusted as is, and this job holds
      # the Cloudflare token.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.18
          cache: false
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/website build
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: bun run --cwd apps/website deploy --branch="$BRANCH"
