name: Website

on:
  push:
    branches: [main]
    paths:
      - apps/website/**
      - bun.lock
      - bunfig.toml
      - mise.toml
      - mise.lock
      - .github/workflows/website.yml
  # A preview deploys once CodeRabbit approves the PR, not on every push to it.
  pull_request_review:
    types: [submitted]

permissions: {}

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Review events can't filter by path, so a preview checks the PR's files
  # itself: the same paths as push, above.
  changes:
    if: >-
      github.event_name == 'pull_request_review' && github.event.review.state == 'approved' && github.event.review.user.login == 'coderabbitai[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # the PR's changed files
    outputs:
      website: ${{ steps.files.outputs.website }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          count=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' |
            grep -cE '^(apps/website/|bun\.lock$|bunfig\.toml$|mise\.(toml|lock)$|\.github/workflows/website\.yml$)' || true)
          echo "website=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: changes
    # main deploys to production; a PR deploys a preview once CodeRabbit approves
    # it, if it touched the website.
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.website == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No tool cache: a restored cache is trusted as is, and this job holds
      # the Cloudflare token.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.18
          cache: false
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/website build
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: bun run --cwd apps/website deploy --branch="$BRANCH"
