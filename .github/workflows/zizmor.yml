name: Actions security

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # zizmor from mise.toml, as locked in mise.lock.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.18
      # The token lets zizmor check pinned SHAs against their tags.
      - run: zizmor --format=github .github/workflows
        env:
          GH_TOKEN: ${{ github.token }}
