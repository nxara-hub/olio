query Products($search: String) {
  products(filter: { search: $search }) {
    items {
      sku
      name
      onHand
      price {
        amount
      }
    }
  }
}

mutation AdjustStock($sku: String!, $warehouse: String!, $delta: Int!) {
  adjustStock(sku: $sku, warehouse: $warehouse, delta: $delta) {
    sku
    onHand
  }
}

subscription StockChanged($sku: String) {
  stockChanged(sku: $sku) {
    sku
    onHand
  }
}

# The same subscription as server-sent events: @sse picks the transport.
subscription StockChangedOverSse($sku: String) @sse {
  stockChanged(sku: $sku) {
    sku
    onHand
  }
}
