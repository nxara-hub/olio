}

union Data = A | B | C

input LoginInput {
  email: String!
  password: String!
}

extend type Query {
  login(input: LoginInput!): Data!
}

extend type Mutation {
  logout: Boolean
}

extend enum ReqErrorCode {
  TEST123
}

type UserPagination {
