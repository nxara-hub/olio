mutation Login($email: String!, $password: String!) {
  login(email: $email, password: $password) {
    __typename
    ... on Session {
      token
    }
    ... on UserError {
      message
    }
  }
}

query Products($search: String) {
  products(filter: { search: $search }) {
    items {
      sku
      price {
        amount
        currency
      }
    }
  }
}

query ProductPage($pageSize: Int) {
  products(filter: { pageSize: $pageSize }) {
    items {
      sku
    }
  }
}
