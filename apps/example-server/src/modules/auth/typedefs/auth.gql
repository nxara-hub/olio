enum Role {
  ADMIN
  MANAGER
  CLERK
}

type Employee @implements(from: ["Node"]) {
  name: String!
  email: String!
  role: Role!
}

type Session {
  token: String!
  employee: Employee!
}

"Takes its message field from UserError."
type InvalidCredentials @implements(from: ["UserError"])

union LoginResult = Session | InvalidCredentials

extend type Query {
  "The signed-in employee, or null."
  me: Employee @bypass(keys: "auth")
}

# Both replace the session the request's context holds, so nothing may run
# next to them in one operation (exclRule, in src/limits.ts).
extend type Mutation {
  login(email: String!, password: String!): LoginResult!
    @bypass(keys: ["auth", "audit"])
    @excl
  logout: Boolean! @excl
}
