type Query

type Mutation

type Subscription

enum Role {
  ADMIN
  MANAGER
  CLERK
}

type Employee implements Node {
  id: ID!
  name: String!
  email: String!
  role: Role!
}

type Session {
  token: String!
  employee: Employee!
}

"Takes its message field from UserError."
type InvalidCredentials implements UserError {
  message: String!
}

union LoginResult = Session | InvalidCredentials

extend type Query {
  "The signed-in employee, or null."
  me: Employee
}

extend type Mutation {
  login(email: String!, password: String!): LoginResult!
  logout: Boolean!
}

"Anything with a stable id."
interface Node {
  id: ID!
}

"Audit timestamps."
interface Timestamped {
  createdAt: DateTime!
  updatedAt: DateTime!
}

"A problem the caller can fix, returned in a result union instead of thrown."
interface UserError {
  message: String!
}

enum Currency {
  EUR
  USD
  GBP
}

"An amount in minor units (cents), so totals never round."
type Money {
  amount: Int!
  currency: Currency!
}

type PageInfo {
  page: Int!
  pageSize: Int!
  total: Int!
  hasNextPage: Boolean!
}

"Paging arguments, copied into every list filter with @copy."
input PageArgs {
  page: Int = 1
  pageSize: Int = 20
}

scalar DateTime

type Warehouse implements Node {
  id: ID!
  code: String!
  name: String!
}

type StockLevel {
  warehouse: Warehouse!
  quantity: Int!
}

type Product implements Node & Timestamped {
  id: ID!
  createdAt: DateTime!
  updatedAt: DateTime!
  sku: String!
  name: String!
  price: Money!
  "Units on hand, per warehouse."
  stock: [StockLevel!]!
  "Units on hand across every warehouse."
  onHand: Int!
}

type ProductPage {
  pageInfo: PageInfo!
  items: [Product!]!
}

input ProductFilter {
  page: Int = 1
  pageSize: Int = 20
  "Matches SKU or name, case-insensitively."
  search: String
}

extend type Query {
  product(sku: String!): Product
  products(filter: ProductFilter): ProductPage!
}

extend type Mutation {
  "Book stock in (positive delta) or out (negative). Managers only."
  adjustStock(sku: String!, warehouse: String!, delta: Int!): Product!
}

extend type Subscription {
  "Fires whenever stock moves, for one SKU or all of them."
  stockChanged(sku: String): Product!
}

type Customer implements Node & Timestamped {
  id: ID!
  createdAt: DateTime!
  updatedAt: DateTime!
  name: String!
  "Personal data: managers and admins only."
  email: String
  creditLimit: Money!
}

input NewCustomer {
  name: String!
  email: String!
  creditLimit: Int!
}

extend type Query {
  customer(id: ID!): Customer
  customers: [Customer!]!
}

extend type Mutation {
  createCustomer(input: NewCustomer!): Customer!
}

enum OrderStatus {
  CONFIRMED
  CANCELLED
}

type OrderLine {
  product: Product!
  quantity: Int!
  unitPrice: Money!
  lineTotal: Money!
}

type SalesOrder implements Node & Timestamped {
  id: ID!
  createdAt: DateTime!
  updatedAt: DateTime!
  number: String!
  customer: Customer!
  status: OrderStatus!
  lines: [OrderLine!]!
  total: Money!
}

type InsufficientStock implements UserError {
  message: String!
  sku: String!
  requested: Int!
  available: Int!
}

union PlaceOrderResult = SalesOrder | InsufficientStock

input OrderLineInput {
  sku: String!
  quantity: Int!
}

extend type Product {
  "Units on confirmed orders."
  unitsSold: Int!
}

extend type Customer {
  orders: [SalesOrder!]!
}

extend type Query {
  orders(status: OrderStatus): [SalesOrder!]!
}

extend type Mutation {
  placeOrder(customerId: ID!, lines: [OrderLineInput!]!): PlaceOrderResult!
  "Managers only."
  cancelOrder(id: ID!): SalesOrder
}